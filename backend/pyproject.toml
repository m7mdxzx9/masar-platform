[project]
name = "masar-backend"
version = "3.0.0"
description = "Masar — Agentic AI Learning Platform with RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "pgvector>=0.4",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.4",
    "llama-index-core>=0.12",
    "llama-index-readers-file>=0.4",
    "chromadb>=1.5",
    "alembic>=1.16",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
