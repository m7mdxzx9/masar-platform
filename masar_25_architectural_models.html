    body {
      background-color: #05070A;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Master Top Switcher Header */
    .master-switcher-nav {
      background: #0B0E14;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .master-bar-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .master-bar-info h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #FFFFFF;
    }

    .arch-tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .arch-tab-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #94A3B8;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .arch-tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: white; }

    .arch-tab-btn.active {
      background: #2563EB;
      color: white;
      border-color: #60A5FA;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }

    /* Viewport Container */
    .arch-viewport-area {
      flex: 1;
      position: relative;
    }

    .arch-instance {
      display: none;
      min-height: calc(100vh - 80px);
      width: 100%;
    }

    .arch-instance.active {
      display: block;
    }

    /* Utilities */
    .font-mono { font-family: 'JetBrains Mono', monospace; direction: ltr; text-align: left; }

          return `<div style="background: #F3F4F6; color: #111827; padding: 40px; font-family: sans-serif;">
            <div style="display: grid; grid-template-columns: 2fr 1fr; border: 3px solid #111827; background: white;">
              <div style="padding: 30px; border-left: 3px solid #111827;">
                <h1 style="font-size: 2rem; color: #DC2626; border-bottom: 3px solid #111827; padding-bottom: 10px;">Model 20: Bauhaus Constructivism</h1>
                <div style="font-family: 'Cairo'; margin-top: 16px;">${sectionsContent}</div>
              </div>
              <div style="background: #2563EB; color: white; padding: 30px; font-weight: 800; font-size: 1.5rem;">
                BAUHAUS GRID<br><br>BKT: 88.4%
              </div>
            </div>
          </div>`;

        case 21: // Terracotta Earthy
          return `<div style="background: #F7F1E5; color: #4A3E3D; padding: 40px;">
            <div style="max-width: 950px; margin: 0 auto; background: #EFE4D1; border-radius: 24px; padding: 32px; border: 1px solid #D8C4B6;">
              <h2 style="color: #C86A58; font-size: 1.6rem; margin-bottom: 16px;">Model 21: Terracotta Earthy Studio</h2>
              ${sectionsContent}
            </div>
          </div>`;

        case 22: // Cyberpunk Technical
          return `<div style="background: #0D0D0D; color: #EAB308; padding: 30px; font-family: monospace;">
            <div style="border: 1px solid #EAB308; padding: 24px; background: #171717;">
              <h2 style="color: #EAB308; font-size: 1.4rem; margin-bottom: 14px; font-family: 'Cairo';">Model 22: Cyberpunk Technical Shell [STATUS: ACTIVE]</h2>
              <div style="font-family: 'Cairo'; color: #FEF08A;">${sectionsContent}</div>
            </div>
          </div>`;

        case 23: // Spatial VisionOS
          return `<div style="background: linear-gradient(135deg, #090D16, #1E1B4B); color: white; padding: 40px;">
            <div style="max-width: 1000px; margin: 0 auto; background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.15); border-radius: 28px; padding: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
              <h2 style="color: #A78BFA; font-size: 1.8rem; margin-bottom: 16px;">Model 23: Spatial VisionOS Translucent Depth</h2>
              ${sectionsContent}
            </div>
          </div>`;

        case 24: // Kanban-Centric Workspace
          return `<div style="background: #0B0F19; color: white; padding: 30px;">
            <h2 style="color: #F87171; margin-bottom: 16px;">Model 24: Kanban-Centric Main Workspace</h2>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;">
              <div style="background: #141B2D; border: 1px solid #334155; border-radius: 12px; padding: 16px;"><strong>📌 قيد الانتظار</strong><p style="font-size: 0.85rem; margin-top: 8px;">K-Means Algorithm</p></div>
              <div style="background: #141B2D; border: 1px solid #334155; border-radius: 12px; padding: 16px;"><strong>⚡ قيد التنفيذ</strong><p style="font-size: 0.85rem; margin-top: 8px;">RAG ChromaDB Pipeline</p></div>
              <div style="background: #141B2D; border: 1px solid #334155; border-radius: 12px; padding: 16px;"><strong>🔍 المراجعة</strong><p style="font-size: 0.85rem; margin-top: 8px;">parse_uqu.py Script</p></div>
              <div style="background: #141B2D; border: 1px solid #334155; border-radius: 12px; padding: 16px;"><strong>✓ المكتملة</strong><p style="font-size: 0.85rem; margin-top: 8px;">BKT Quiz Evaluation</p></div>
            </div>
            <div style="background: #141B2D; border: 1px solid #334155; border-radius: 16px; padding: 20px;">${sectionsContent}</div>
          </div>`;

        case 25: // Analytics Graph First
          return `<div style="background: #0A0E17; color: white; padding: 30px;">
            <div style="background: #111827; border: 1px solid #1F2937; border-radius: 20px; padding: 28px; margin-bottom: 20px;">
              <h2 style="color: #60A5FA; font-size: 1.6rem;">Model 25: Analytics & BKT Knowledge Graph First (70% Focus)</h2>
              <div style="height: 200px; background: rgba(0,0,0,0.3); border-radius: 12px; margin-top: 14px; display: flex; align-items: flex-end; justify-content: space-around; padding: 20px;">
                <div style="height: 45%; width: 40px; background: #3B82F6; border-radius: 6px;"></div>
                <div style="height: 65%; width: 40px; background: #3B82F6; border-radius: 6px;"></div>
                <div style="height: 80%; width: 40px; background: #3B82F6; border-radius: 6px;"></div>
                <div style="height: 95%; width: 40px; background: #10B981; border-radius: 6px;"></div>
              </div>
            </div>
            <div style="background: #111827; border: 1px solid #1F2937; border-radius: 20px; padding: 24px;">${sectionsContent}</div>
          </div>`;
      }
    }

    // Render Tabs and Viewports
    const tabsBar = document.getElementById('tabsBar');
    const viewportContainer = document.getElementById('viewportContainer');

    archModels.forEach((m, idx) => {
      // Create Tab
      const btn = document.createElement('button');
      btn.className = `arch-tab-btn ${m.id === 1 ? 'active' : ''}`;
      btn.innerText = m.name;
      btn.onclick = () => switchArch(m.id);
      tabsBar.appendChild(btn);

      // Create Viewport Instance
      const inst = document.createElement('div');
      inst.className = `arch-instance ${m.id === 1 ? 'active' : ''}`;
      inst.id = `arch-view-${m.id}`;
      inst.innerHTML = getArchitecturalDOM(m.id);
      viewportContainer.appendChild(inst);
    });

    function switchArch(id) {
      const btns = document.querySelectorAll('.arch-tab-btn');
      btns.forEach((b, idx) => {
        if (idx === id - 1) b.classList.add('active');
        else b.classList.remove('active');
      });

      const views = document.querySelectorAll('.arch-instance');
      views.forEach((v, idx) => {
        if (idx === id - 1) v.classList.add('active');
        else v.classList.remove('active');
      });

      document.getElementById('archModelName').innerText = archModels[id - 1].desc;
    }
  </script>
</body>
</html>
