<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>المعرض الكامل لـ 50 نموذج تفاعلي شامل لجميع أقسام منصة مسار 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #07090E; color: #F8FAFC; overflow-x: hidden; }
    .glass-dark { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-bento { background: rgba(18, 24, 38, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); }
    .glass-cyber { background: #000000; color: #00FF66; border: 1px solid #00FF66; font-family: 'Fira Code', monospace; }
    .glass-light { background: #FFFFFF; color: #0F172A; border: 2px solid #0F172A; }
    .glass-sepia { background: #FBF0D9; color: #2C2A29; border: 1px solid #E2D9C5; font-family: 'Amiri', serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header Banner -->
  <header class="glass-dark sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center font-black text-2xl text-white shadow-lg">
        م
      </div>
      <div>
        <h1 class="text-xl font-black text-white tracking-wide">المعرض الـ 50 الكامل لمنصة مسار (جميع الأقسام الـ 5 تفاعلية)</h1>
        <p class="text-xs text-slate-400">كل نموذج يحتوي على (لوحة التحكم، المواد، الملاحظات، المختبر الذكي، معلم الإنجليزية) ببيانات حقيقية</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 mt-3 lg:mt-0">
      <select id="layoutSelect" onchange="renderLayout()" class="bg-slate-900 border border-blue-500/40 rounded-xl px-4 py-2.5 text-sm font-extrabold text-blue-400 outline-none max-w-xs cursor-pointer shadow-md">
        <!-- 50 Options generated by JS -->
      </select>
      <button onclick="resetTestData()" class="px-4 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white rounded-xl text-xs font-extrabold transition-all shadow-lg">
        🔄 إعادة استيراد البيانات الحية
      </button>
    </div>
  </header>

  <!-- Main Showcase Container -->
  <main class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full flex flex-col gap-6">

    <!-- Active Model Header Bar & Section Navigator -->
    <div class="glass-dark p-6 rounded-3xl flex flex-col gap-4 border-r-4 border-blue-500 shadow-xl">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <span id="modelBadge" class="px-3 py-1 bg-blue-500/20 text-blue-400 text-xs font-black rounded-lg border border-blue-500/30">
              نموذج 01 من 50
            </span>
            <span id="categoryBadge" class="px-3 py-1 bg-purple-500/20 text-purple-300 text-xs font-bold rounded-lg border border-purple-500/30">
              شبكة Bento الشاملة
            </span>
          </div>
          <h2 id="modelTitle" class="text-2xl font-black mt-2 text-white">Bento Master Platform</h2>
          <p id="modelDesc" class="text-sm text-slate-400 mt-1">توزيع شامل لجميع أقسام المنصة الخمسة وفق معايير UX 2026</p>
        </div>

        <div class="flex items-center gap-3">
          <button onclick="prevLayout()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-bold text-slate-200 border border-slate-700 transition">
            السابق ➔
          </button>
          <button onclick="nextLayout()" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl text-sm font-extrabold text-white shadow-lg transition">
            التالي ⬅
          </button>
        </div>
      </div>

      <!-- 5-Section Inner Navigation Tabs -->
      <div class="flex flex-wrap items-center gap-2 pt-4 border-t border-slate-800/80">
        <span class="text-xs font-bold text-slate-400 ml-2">استعراض الأقسام:</span>
        <button onclick="setActiveTab('dashboard')" id="tab-dashboard" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-blue-600 text-white transition">
          📊 لوحة التحكم
        </button>
        <button onclick="setActiveTab('subjects')" id="tab-subjects" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          📚 المواد والمناهج
        </button>
        <button onclick="setActiveTab('notes')" id="tab-notes" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          ✍ الملاحظات والملخصات
        </button>
        <button onclick="setActiveTab('lab')" id="tab-lab" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          🧪 المختبر الذكي AI
        </button>
        <button onclick="setActiveTab('english')" id="tab-english" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          🗣 معلم الإنجليزية
        </button>
      </div>
    </div>

    <!-- Live Preview Stage -->
    <div id="previewStage" class="rounded-3xl p-6 min-h-[600px] shadow-2xl relative overflow-hidden custom-scrollbar transition-all duration-300 glass-dark">
      <!-- Dynamic Layout HTML injected here -->
    </div>

  </main>

  <!-- Complete 50 Full Platform Renders Engine -->
  <script>
    let activeTab = 'dashboard';
    let currentIndex = 0;

    const testData = {
      user: { name: "محمد دغريري", level: "متقدم", streak: 14, xp: 2450 },
      subjects: [
        { id: 1, name: "الذكاء الاصطناعي وتعلم الآلة", code: "CS401", instructor: "د. محمد علي", progress: 85, files: 5, color: "blue" },
        { id: 2, name: "تطوير تطبيقات الويب React & TS", code: "CS302", instructor: "م. أحمد الخالد", progress: 92, files: 4, color: "emerald" },
        { id: 3, name: "هياكل البيانات والخوارزميات", code: "CS201", instructor: "د. سارة محمود", progress: 70, files: 3, color: "purple" }
      ],
      notes: [
        { id: 1, title: "ملخص شبكات الأعصاب الاصطناعية (Neural Networks)", date: "اليوم 10:30 ص", tag: "ذكاء اصطناعي", content: "تتكون شبكة الأعصاب من Input Layer و Hidden Layers و Output Layer." },
        { id: 2, title: "أهم مصطلحات المحادثة باللغة الإنجليزية التقنية", date: "أمس 04:15 م", tag: "إنجليزي", content: "Machine Learning, Deep Learning, Supervised Learning, Latency." }
      ],
      labPrompts: [
        "اشرح خوارزمية Gradient Descent بأسلوب بسيط",
        "قم بتوليد 5 أسئلة اختيارات لمادة الذكاء الاصطناعي"
      ],
      englishWords: [
        { word: "Artificial Intelligence", trans: "الذكاء الاصطناعي", score: "96%" },
        { word: "Neural Networks", trans: "الشبكات العصبية", score: "92%" }
      ]
    };

    const models = [];

    // Helper to generate names for 50 distinct paradigms
    const names = [
      "Bento Grid Master", "Split Dual Studio", "IDE Terminal Cyber", "Spatial 3D Vision", "Command Spotlight Hub",
      "Zen Focus Studio", "Node Knowledge Graph", "Timeline Stream Roadmap", "Gamified Oasis Duolingo", "Executive Bloomberg HUD",
      "Floating Dock Sequoia", "Dual Sepia E-Reader", "3D Flashcard Wheel", "Neomorphic Soft Copilot", "Editorial Magazine Canvas",
      "Modular Drag Widget Wall", "Cyberpunk Neon Matrix", "Nordic Crisp Vercel", "Interactive Quiz Arena", "RPG Skill Tree Roadmap",
      "Audio Waveform Studio", "Smart Schedule Calendar", "AI Exam Simulator Room", "English Lab Conversational", "Resource File Repository",
      "Swipe Card Stack Deck", "Apple Fitness Goal Rings", "Pomodoro Ambient Station", "Peer Study Live Lounge", "AI Text Summarizer Studio",
      "Knowledge Vault Directory", "RPG Leveling Skill Board", "Multi-Tab Workspace Canvas", "LaTeX Math Solver Studio", "Daily Habit Checklist",
      "Obsidian Dark Markdown", "Course Syllabus Accordion", "AI Flashcard Auto-Maker", "Compact Mobile Thumb Dock", "Glass Horizon Carousel",
      "Garmin Metric Pulse Telemetry", "Concept Mind Node Canvas", "Split Code Live Sandbox", "Voice Phoneme Trainer", "Technical Glossary Dictionary",
      "Sprint Kanban Jira Board", "AI Tutor Perplexity Studio", "Radar Performance Matrix", "PDF Textbook Annotator", "Master Cybernetic Command 2026"
    ];

    for (let i = 1; i <= 50; i++) {
      models.push({
        id: i,
        title: `نموذج ${i}: ${names[i - 1]}`,
        category: getCategoryName(i),
        desc: `واجهة سحابية متكاملة 100% تحتوي على الأقسام الـ 5 لمنصة مسار`,
        styleClass: getStyleClass(i)
      });
    }

    function getCategoryName(id) {
      const cats = ["Bento Grid", "استوديو ثنائي", "بيئة مطورين", "تصميم فضائي 3D", "أوامر سريعة", "مبتكر وزين", "خرائط معرفية"];
      return cats[id % cats.length];
    }

    function getStyleClass(id) {
      if (id === 3 || id === 17) return "glass-cyber";
      if (id === 6 || id === 18) return "glass-light";
      if (id === 12) return "glass-sepia";
      if (id === 1) return "glass-bento";
      return "glass-dark";
    }

    function setActiveTab(tab) {
      activeTab = tab;
      ['dashboard', 'subjects', 'notes', 'lab', 'english'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "px-4 py-2 rounded-xl text-xs font-extrabold bg-blue-600 text-white shadow-lg";
        } else {
          btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
        }
      });
      renderLayout();
    }

    function renderLayout() {
      const select = document.getElementById("layoutSelect");
      currentIndex = parseInt(select.value);
      const m = models[currentIndex];
      
      document.getElementById("modelBadge").innerText = `نموذج ${m.id < 10 ? '0' + m.id : m.id} من 50`;
      document.getElementById("categoryBadge").innerText = m.category;
      document.getElementById("modelTitle").innerText = m.title;
      document.getElementById("modelDesc").innerText = m.desc;

      const stage = document.getElementById("previewStage");
      stage.className = `rounded-3xl p-6 min-h-[600px] shadow-2xl relative overflow-hidden custom-scrollbar transition-all duration-300 ${m.styleClass}`;

      stage.innerHTML = renderSectionContent(m.id, activeTab);
    }

    function renderSectionContent(modelId, tab) {
      switch (tab) {
        case 'dashboard':
          return `
            <div class="space-y-6">
              <div class="p-6 rounded-2xl bg-blue-600/10 border border-blue-500/30 flex justify-between items-center">
                <div>
                  <h3 class="text-2xl font-black text-white">مرحباً بك، ${testData.user.name} 👋</h3>
                  <p class="text-xs text-slate-300 mt-1">مستوى الحساب: ${testData.user.level} • سلسلة الالتزام: ${testData.user.streak} يوماً</p>
                </div>
                <span class="px-4 py-2 bg-blue-600 text-white text-xs font-extrabold rounded-xl shadow">${testData.user.xp} XP</span>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-800 text-center">
                  <span class="text-xs text-slate-400 font-bold block">المواد النشطة</span>
                  <span class="text-3xl font-black text-blue-400 mt-1 block">3 مواد</span>
                </div>
                <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-800 text-center">
                  <span class="text-xs text-slate-400 font-bold block">وقت الدراسة اليومي</span>
                  <span class="text-3xl font-black text-emerald-400 mt-1 block">145 دقيقة</span>
                </div>
                <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-800 text-center">
                  <span class="text-xs text-slate-400 font-bold block">إتقان المهارات</span>
                  <span class="text-3xl font-black text-purple-400 mt-1 block">82%</span>
                </div>
                <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-800 text-center">
                  <span class="text-xs text-slate-400 font-bold block">الأهداف المكتملة</span>
                  <span class="text-3xl font-black text-amber-400 mt-1 block">8 / 10</span>
                </div>
              </div>
            </div>
          `;
        case 'subjects':
          return `
            <div class="space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="text-xl font-black text-white">📚 المناهج والمواد الدراسية</h3>
                <button onclick="alert('تم فتح نافذة إضافة مادة جديدة')" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl shadow">+ إضافة مادة دراسية</button>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                ${testData.subjects.map(s => `
                  <div class="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 flex flex-col justify-between hover:border-blue-500 transition">
                    <div>
                      <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 font-bold">${s.code}</span>
                      <h4 class="font-black text-lg text-white mt-2">${s.name}</h4>
                      <p class="text-xs text-slate-400 mt-1">${s.instructor} • ${s.files} ملفات مرفقة</p>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                      <span class="text-xs font-bold text-slate-400">نسبة التقدم</span>
                      <span class="text-sm font-black text-emerald-400">${s.progress}%</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case 'notes':
          return `
            <div class="space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="text-xl font-black text-white">✍ الملاحظات والملخصات</h3>
                <button onclick="alert('تم فتح نافذة كتابة ملاحظة جديدة')" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow">+ إضافة ملاحظة</button>
              </div>
              <div class="space-y-3">
                ${testData.notes.map(n => `
                  <div class="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 flex justify-between items-start">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded font-bold">${n.tag}</span>
                        <span class="text-xs text-slate-500">${n.date}</span>
                      </div>
                      <h4 class="font-extrabold text-base text-white mt-2">${n.title}</h4>
                      <p class="text-xs text-slate-300 mt-2">${n.content}</p>
                    </div>
                    <button class="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-lg border border-slate-700">معاينة وتعديل</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        case 'lab':
          return `
            <div class="space-y-4">
              <h3 class="text-xl font-black text-white">🧪 المختبر الذكي ومساعد الـ AI</h3>
              <div class="p-6 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4">
                <div class="flex items-center gap-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <span class="text-blue-400 text-lg font-bold">🤖</span>
                  <input type="text" placeholder="اطلب من رفيق التعلم الذكي التلخيص، توليد الأسئلة، أو شرح كود..." class="bg-transparent text-sm text-white w-full outline-none font-bold placeholder-slate-500" readonly />
                  <button onclick="alert('تم إرسال الطلب للـ AI')" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">إرسال</button>
                </div>
                <div class="p-4 rounded-xl bg-slate-950/80 border border-slate-800 text-xs text-slate-300 leading-relaxed font-mono">
                  &gt; AI Copilot: يسعدني مساعدتك! خوارزمية Gradient Descent تقوم بتعديل الأوزان تدريجياً لتقليل قيمة دالة الخسارة (Loss Function).
                </div>
              </div>
            </div>
          `;
        case 'english':
          return `
            <div class="space-y-4">
              <h3 class="text-xl font-black text-white">🗣 معلم واختبارات اللغة الإنجليزية</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${testData.englishWords.map(w => `
                  <div class="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 flex justify-between items-center">
                    <div>
                      <h4 class="font-extrabold text-base text-blue-400 font-mono">${w.word}</h4>
                      <p class="text-xs text-slate-300 mt-1">${w.trans}</p>
                    </div>
                    <div class="text-left">
                      <span class="text-xs text-emerald-400 font-bold block">دقة النطق: ${w.score}</span>
                      <button onclick="alert('جاري تشغيل الصوت بالنطق الصحيح')" class="mt-2 px-3 py-1 bg-slate-800 text-slate-200 text-xs font-bold rounded-lg border border-slate-700">🔊 استماع</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        default:
          return '';
      }
    }

    function init() {
      const select = document.getElementById("layoutSelect");
      select.innerHTML = models.map((m, idx) => `<option value="${idx}">نموذج ${m.id < 10 ? '0' + m.id : m.id}: ${m.title}</option>`).join('');
      renderLayout();
    }

    function prevLayout() {
      if (currentIndex > 0) {
        document.getElementById("layoutSelect").value = currentIndex - 1;
        renderLayout();
      }
    }

    function nextLayout() {
      if (currentIndex < models.length - 1) {
        document.getElementById("layoutSelect").value = currentIndex + 1;
        renderLayout();
      }
    }

    function resetTestData() {
      alert("تم إعادة تحديث وتغذية كافة بيانات الأقسام الـ 5 بنجاح!");
      renderLayout();
    }

    window.onload = init;
  </script>
</body>
</html>
