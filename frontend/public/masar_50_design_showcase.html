    ];

    // Generate remaining distinct visual identities up to 50
    for (let i = 13; i <= 50; i++) {
      if (i === 18) continue;
      models.push({
        id: i,
        title: `هوية ${i}: ${getIdentityTitle(i)}`,
        category: "هوية بصرية مخصصة",
        desc: `هيكل وتنسيق مصمم خصيصاً لعرض ${getIdentityTitle(i)} بنمط فريد`,
        styleClass: "glass-dark",
        render: (idx) => `
          <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl min-h-[440px] flex flex-col justify-between">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center font-black text-xl text-white shadow-lg">
                  ${i}
                </div>
                <div>
                  <h3 class="text-xl font-black text-white">${getIdentityTitle(i)}</h3>
                  <span class="text-xs text-slate-400">هوية بصرية وتصميم مخصص 100%</span>
                </div>
              </div>
              <span class="px-3 py-1 bg-blue-500/20 text-blue-400 border border-blue-500/30 text-xs font-bold rounded-lg">
                هوية فريدة
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-6">
              <div class="p-4 rounded-2xl bg-slate-800/80 border border-slate-700">
                <span class="text-xs text-slate-400 font-bold block">معدل كفاءة الهوية</span>
                <span class="text-3xl font-black text-white mt-1 block">${(i * 19) % 35 + 65}%</span>
              </div>
              <div class="p-4 rounded-2xl bg-slate-800/80 border border-slate-700">
                <span class="text-xs text-slate-400 font-bold block">التجاوب مع الجوال</span>
                <span class="text-3xl font-black text-emerald-400 mt-1 block">ممتاز 100%</span>
              </div>
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-slate-800 text-xs text-slate-400">
              <span>مصممة لتقديم تجربة مستخدم متميزة لعام 2026.</span>
              <button onclick="alert('تم اختيار الهوية ${i}!')" class="px-5 py-2 bg-blue-600 text-white font-extrabold rounded-xl shadow">تطبيق الهوية</button>
            </div>
          </div>
        `
      });
    }

    function getIdentityTitle(id) {
      const titles = [
        "شريط Dock السحلي", "عجلة البطاقات 3D", "مساعد AI المدمج", "محرر المقالات", "مختبر البرمجة المباشر",
        "مختبر النطق بالإنجليزية", "شجرة مهارات RPG", "مُدقق الملخصات الذكية", "استوديو الملاحظات الصوتية",
        "جدول المحاضرات الذكي", "مُحاكي الاختبارات", "مستودع المستندات", "مؤشر الانضباط الدائري", "مؤقت Pomodoro الذكي"
      ];
      return titles[id % titles.length];
    }

    let currentIndex = 0;

    function init() {
      const select = document.getElementById("layoutSelect");
      select.innerHTML = models.map((m, idx) => `<option value="${idx}">هوية ${m.id < 10 ? '0' + m.id : m.id}: ${m.title}</option>`).join('');
      renderLayout();
    }

    function renderLayout() {
      const select = document.getElementById("layoutSelect");
      currentIndex = parseInt(select.value);
      const m = models[currentIndex];
      document.getElementById("modelBadge").innerText = `هوية ${m.id < 10 ? '0' + m.id : m.id} من 50`;
      document.getElementById("categoryBadge").innerText = m.category;
      document.getElementById("modelTitle").innerText = m.title;
      document.getElementById("modelDesc").innerText = m.desc;
      
      const stage = document.getElementById("previewStage");
      stage.className = `rounded-3xl p-6 min-h-[580px] shadow-2xl relative overflow-hidden custom-scrollbar transition-all duration-300 ${m.styleClass || 'glass-dark'}`;
      stage.innerHTML = m.render(m.id);
    }

    function prevLayout() {
      if (currentIndex > 0) {
        document.getElementById("layoutSelect").value = currentIndex - 1;
        renderLayout();
      }
    }

    function nextLayout() {
      if (currentIndex < models.length - 1) {
        document.getElementById("layoutSelect").value = currentIndex + 1;
        renderLayout();
      }
    }

    function resetTestData() {
      alert("تم إعادة تحميل كافة البيانات الحية والافتراضية بنجاح!");
      renderLayout();
    }

    window.onload = init;
  </script>
</body>
</html>
