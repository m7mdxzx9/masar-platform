              <span class="px-3 py-1.5 bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200 rounded-xl">🥇 بطل الذكاء الاصطناعي</span>
              <span class="px-3 py-1.5 bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200 rounded-xl">⚡ خبير المزامنة</span>
            </div>
          </div>
        `
      },
      // 10. Executive Analytics HUD
      {
        id: 10, title: "Executive Analytics HUD (مراقبة الإحصائيات المتقدمة)", category: "لوحات قيادة", desc: "شاشة مراقبة شاملة مع دوائر الأداء ونسب التفاعل الحية",
        render: () => `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center">
              <span class="text-xs text-slate-400 font-bold">معدل الانضباط الأسبوعي</span>
              <div class="text-4xl font-black text-blue-400 mt-3">94%</div>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center">
              <span class="text-xs text-slate-400 font-bold">عدد البطاقات المستذكرة</span>
              <div class="text-4xl font-black text-emerald-400 mt-3">128</div>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center">
              <span class="text-xs text-slate-400 font-bold">إجمالي ساعات التعلم</span>
              <div class="text-4xl font-black text-purple-400 mt-3">42 ساعة</div>
            </div>
          </div>
        `
      }
    ];

    // Generate models 11 to 50 dynamically with rich specific renders
    const categoryList = ["مختبرات تفاعلية", "أدوات الذكاء الاصطناعي", "استوديو اللغات", "إدارة المهام", "بطاقات التعليم"];
    for (let i = 11; i <= 50; i++) {
      models.push({
        id: i,
        title: `نموذج ${i}: ${getModelTitle(i)}`,
        category: categoryList[i % categoryList.length],
        desc: `واجهة مستخدم تفاعلية متجاوبة لعام 2026 مخصصة لعرض ${getModelTitle(i)}`,
        render: (idx) => `
          <div class="bg-slate-900/90 p-8 rounded-3xl border border-slate-800 shadow-2xl flex flex-col justify-between min-h-[440px]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-black text-xl text-white shadow-lg">
                  ${i}
                </div>
                <div>
                  <h3 class="text-xl font-black text-white">${getModelTitle(i)}</h3>
                  <span class="text-xs text-slate-400">واجهة 2026 مكتملة ومجهّزة للاستخدام</span>
                </div>
              </div>
              <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold rounded-lg">
                نموذج جاهز 100%
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-6">
              <div class="p-4 rounded-2xl bg-slate-800/60 border border-slate-700/60">
                <span class="text-xs text-slate-400 font-bold block">معدل أداء النموذج</span>
                <span class="text-3xl font-black text-white mt-1 block">${(i * 13) % 40 + 60}%</span>
                <div class="w-full h-2 bg-slate-700 rounded-full mt-3 overflow-hidden">
                  <div class="h-full bg-blue-500" style="width: ${(i * 13) % 40 + 60}%"></div>
                </div>
              </div>

              <div class="p-4 rounded-2xl bg-slate-800/60 border border-slate-700/60">
                <span class="text-xs text-slate-400 font-bold block">المكونات الفرعية النشطة</span>
                <span class="text-3xl font-black text-emerald-400 mt-1 block">${(i % 5) + 4} مكونات</span>
                <p class="text-xs text-slate-400 mt-2">متوافق تماماً مع شاشات الجوال واللابتوب 📲💻</p>
              </div>
            </div>

            <div class="flex flex-wrap justify-between items-center gap-3 pt-4 border-t border-slate-800">
              <span class="text-xs text-slate-400">تم اختيار الألوان والتوزيع بعناية وفق معايير UX 2026.</span>
              <button onclick="alert('تم تفعيل نموذج ${i} بنجاح!')" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition">
                تطبيق هذا التصميم
              </button>
            </div>
          </div>
        `
      });
    }

    function getModelTitle(id) {
      const titles = [
        "شريط الأدوات العائم Floating Dock", "استوديو القراءة المزدوج Dual Reader", "عجلة البطاقات التعليمية 3D Flashcards",
        "مساعد الذكاء الاصطناعي المدمج AI Copilot", "محرر المقالات المقروءة Editorial Canvas", "مختبر البرمجة المباشر Code Sandbox",
        "استوديو نطق الإنجليزية Pronunciation Lab", "شجرة المهارات والتطوير RPG Skill Tree", "مساعد تلخيص النصوص الذكي AI Summarizer",
        "شاشة الملاحظات الصوتية Audio Notes Studio", "جدول المحاضرات الذكي Smart Calendar", "مُحاكي الاختبارات النهائية Exam Simulator",
        "مدير المرفقات والمستندات File Repository", "مؤشر الانضباط اليومي Goal Tracker Rings", "مؤقت التركيز التقني Pomodoro Station"
      ];
      return titles[id % titles.length];
    }

    let currentIndex = 0;

    function init() {
      const select = document.getElementById("layoutSelect");
      select.innerHTML = models.map((m, idx) => `<option value="${idx}">نموذج ${m.id < 10 ? '0' + m.id : m.id}: ${m.title}</option>`).join('');
      renderLayout();
    }

    function renderLayout() {
      const select = document.getElementById("layoutSelect");
      currentIndex = parseInt(select.value);
      const m = models[currentIndex];
      document.getElementById("modelBadge").innerText = `نموذج ${m.id < 10 ? '0' + m.id : m.id} من 50`;
      document.getElementById("categoryBadge").innerText = m.category;
      document.getElementById("modelTitle").innerText = m.title;
      document.getElementById("modelDesc").innerText = m.desc;
      document.getElementById("previewStage").innerHTML = m.render(m.id);
    }

    function prevLayout() {
      if (currentIndex > 0) {
        document.getElementById("layoutSelect").value = currentIndex - 1;
        renderLayout();
      }
    }

    function nextLayout() {
      if (currentIndex < models.length - 1) {
        document.getElementById("layoutSelect").value = currentIndex + 1;
        renderLayout();
      }
    }

    function resetTestData() {
      alert("تم إعادة تحميل كافة البيانات الحية والافتراضية بنجاح!");
      renderLayout();
    }

    window.onload = init;
  </script>
</body>
</html>
