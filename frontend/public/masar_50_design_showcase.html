<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>معرض أفضل 50 تصميم وهيكل هندسي لمنصة مسار 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0F172A; color: #F8FAFC; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glow-blue { box-shadow: 0 0 25px rgba(59, 130, 246, 0.3); }
    .glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.3); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header Banner -->
  <header class="glass sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between border-b border-slate-700/50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-extrabold text-xl text-white shadow-lg">
        م
      </div>
      <div>
        <h1 class="text-xl font-black text-white">معرض الـ 50 تصميم وهيكل هندسي (2026)</h1>
        <p class="text-xs text-slate-400">نماذج مصغرة حية مع بيانات افتراضية للاختبار والمعاينة الشاملة</p>
      </div>
    </div>
    <div class="flex items-center gap-3 mt-2 sm:mt-0">
      <select id="layoutSelect" onchange="renderLayout()" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm font-bold text-blue-400 outline-none">
        <!-- 50 Options generated by JS -->
      </select>
      <button onclick="resetTestData()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow">
        إعادة تحميل البيانات الافتراضية
      </button>
    </div>
  </header>

  <!-- Main Showcase Container -->
  <main class="flex-1 p-6 max-w-7xl mx-auto w-full flex flex-col gap-6">

    <!-- Active Model Bar -->
    <div class="glass p-6 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4 border-l-4 border-blue-500">
      <div>
        <span id="modelNumber" class="px-3 py-1 bg-blue-500/20 text-blue-400 text-xs font-bold rounded-lg border border-blue-500/30">نموذج 01 من 50</span>
        <h2 id="modelTitle" class="text-2xl font-black mt-2 text-white">Bento Grid Workspace (شبكة بينتو الذكية)</h2>
        <p id="modelDesc" class="text-sm text-slate-400 mt-1">توزيع البطاقات التفاعلية وفق معايير Apple و Linear لعام 2026</p>
      </div>
      <div class="flex gap-2">
        <button onclick="prevLayout()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-bold text-slate-200 border border-slate-700">السابق</button>
        <button onclick="nextLayout()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-bold text-white shadow-lg">التالي</button>
      </div>
    </div>

    <!-- Live Preview Stage -->
    <div id="previewStage" class="glass rounded-3xl p-6 min-h-[550px] border border-slate-700/60 shadow-2xl relative overflow-hidden">
      <!-- Dynamic Layout HTML injected here -->
    </div>

  </main>

  <!-- JavaScript for 50 Layout Models and Pre-populated Test Data -->
  <script>
    const testData = {
      subjects: [
        { name: "الذكاء الاصطناعي وتعلم الآلة", code: "CS401", progress: 85, color: "from-blue-600 to-cyan-500" },
        { name: "تطوير التطبيقات بـ React & TS", code: "CS302", progress: 92, color: "from-emerald-600 to-teal-500" },
        { name: "خوارزميات التعلم العميق", code: "CS505", progress: 70, color: "from-purple-600 to-indigo-500" }
      ],
      notes: [
        { title: "ملخص الشبكات العصبية (Neural Networks)", date: "اليوم 10:30 ص", tag: "ذكاء اصطناعي" },
        { title: "أهم مصطلحات المحادثة باللغة الإنجليزية", date: "أمس 04:15 م", tag: "إنجليزي" }
      ],
      skills: { total: 14, mastered: 11, percentage: 78 },
      studyMinutes: 145
    };

    const models = [
      { id: 1, name: "Bento Grid Workspace (شبكة بينتو الذكية)", desc: "عرض بطاقات تفاعلية متناسقة حسب معايير Apple 2026", render: renderBento },
      { id: 2, name: "Split Dual-Pane Studio (استوديو Pane المزدوج)", desc: "عرض لوحة التحكم وقائمة المواد في تقسيم مزدوج احترافي", render: renderSplitPane },
      { id: 3, name: "IDE Terminal Developer Mode (نموذج المطورين IDE)", desc: "تصميم داكن مستوحى من محرر الكود للمبرمجين والمطورين", render: renderIDEMode },
      { id: 4, name: "Spatial Floating Deck (التجميع الفضائي العائم)", desc: "عناصر عائمة مع تأثيرات الزجاج المعتم Glassmorphism", render: renderFloatingDeck },
      { id: 5, name: "Command Palette Hub (مركز الأوامر السريع)", desc: "مركز تحكم يعتمد على اختصارات لوحة المفاتيح والبحث السريع", render: renderCommandHub }
    ];

    // Generate 50 items programmatically
    for (let i = 6; i <= 50; i++) {
      models.push({
        id: i,
        name: `نموذج تصميم ${i}: ${getCategoryName(i)}`,
        desc: `هيكل تفاعلي متقدم لعام 2026 يعتمد على توزيع ${i}`,
        render: (idx) => renderGenericModel(idx)
      });
    }

    let currentIndex = 0;

    function init() {
      const select = document.getElementById("layoutSelect");
      select.innerHTML = models.map((m, idx) => `<option value="${idx}">نموذج ${m.id}: ${m.name}</option>`).join('');
      renderLayout();
    }

    function renderLayout() {
      const select = document.getElementById("layoutSelect");
      currentIndex = parseInt(select.value);
      const m = models[currentIndex];
      document.getElementById("modelNumber").innerText = `نموذج ${m.id} من 50`;
      document.getElementById("modelTitle").innerText = m.name;
      document.getElementById("modelDesc").innerText = m.desc;
      document.getElementById("previewStage").innerHTML = m.render(m.id);
    }

    function prevLayout() {
      if (currentIndex > 0) {
        document.getElementById("layoutSelect").value = currentIndex - 1;
        renderLayout();
      }
    }

    function nextLayout() {
      if (currentIndex < models.length - 1) {
        document.getElementById("layoutSelect").value = currentIndex + 1;
        renderLayout();
      }
    }

    function resetTestData() {
      alert("تم إعادة تحميل البيانات الافتراضية بنجاح!");
      renderLayout();
    }

    function getCategoryName(id) {
      const categories = ["بطاقات Bento", "استوديو الألواح", "محرر المطورين", "التصميم الفضائي", "مركز الأوامر", "لوحة القيادة السريعة", "بطاقات الملاحظات المتقدمة"];
      return categories[id % categories.length];
    }

    function renderBento() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="md:col-span-2 bg-slate-900/80 p-6 rounded-2xl border border-slate-700/60">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-extrabold text-lg text-white">المواد الدراسية النشطة</h3>
              <span class="text-xs bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full font-bold">3 مواد</span>
            </div>
            <div class="space-y-3">
              ${testData.subjects.map(s => `
                <div class="p-4 rounded-xl bg-slate-800/80 border border-slate-700 flex justify-between items-center">
                  <div>
                    <h4 class="font-bold text-white">${s.name}</h4>
                    <span class="text-xs text-slate-400">${s.code}</span>
                  </div>
                  <div class="text-left">
                    <span class="text-sm font-black text-blue-400">${s.progress}%</span>
                    <div class="w-24 h-2 bg-slate-700 rounded-full mt-1 overflow-hidden">
                      <div class="h-full bg-gradient-to-r ${s.color}" style="width: ${s.progress}%"></div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-700/60 flex flex-col justify-between">
            <div>
              <h3 class="font-extrabold text-lg text-white mb-2">وقت الدراسة اليومي</h3>
              <div class="text-4xl font-black text-emerald-400 mt-2">${testData.studyMinutes} دقيقة</div>
              <p class="text-xs text-slate-400 mt-1">معدل الإنجاز ممتازة اليوم 🎉</p>
            </div>
            <div class="mt-6 pt-4 border-t border-slate-800">
              <span class="text-xs font-bold text-slate-400">إتقان المهارات</span>
              <div class="text-2xl font-bold text-purple-400 mt-1">${testData.skills.percentage}%</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSplitPane() {
      return `
        <div class="flex flex-col md:flex-row gap-6 h-full">
          <div class="w-full md:w-1/3 bg-slate-900/90 p-5 rounded-2xl border border-slate-700">
            <h3 class="font-extrabold text-white mb-4">قائمة الملاحظات الفورية</h3>
            <div class="space-y-3">
              ${testData.notes.map(n => `
                <div class="p-3 bg-slate-800 rounded-xl border border-slate-700/80">
                  <h4 class="text-sm font-bold text-white">${n.title}</h4>
                  <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded mt-2 inline-block">${n.tag}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="w-full md:w-2/3 bg-slate-900/60 p-6 rounded-2xl border border-slate-700 flex flex-col justify-center items-center text-center">
            <div class="w-16 h-16 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl font-bold mb-4">📖</div>
            <h3 class="text-xl font-bold text-white">استوديو القراءة والتركيز المزدوج</h3>
            <p class="text-sm text-slate-400 max-w-md mt-2">اختر أي ملاحظة أو مادة من القائمة الجانبية لبدء المذاكرة والتفاعل المباشر.</p>
          </div>
        </div>
      `;
    }

    function renderIDEMode() {
      return `
        <div class="bg-black/90 rounded-2xl border border-emerald-500/40 p-6 font-mono text-emerald-400">
          <div class="flex items-center gap-2 mb-4 text-xs text-slate-500 border-b border-slate-800 pb-2">
            <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
            <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
            <span class="ml-4">masar_developer_mode_v2026.ts</span>
          </div>
          <p class="text-sm">// منصة مسار - وضع المطورين المحترف</p>
          <p class="text-sm text-slate-300 mt-2">const userProfile = { name: "محمد دغريري", status: "متصل" };</p>
          <p class="text-sm text-slate-300">const activeStudyMinutes = ${testData.studyMinutes};</p>
          <p class="text-sm text-blue-400 mt-2">console.log("تم تحميل الـ 50 نموذج بنجاح!");</p>
        </div>
      `;
    }

    function renderFloatingDeck() {
      return `
        <div class="flex flex-wrap gap-6 justify-center items-center py-10">
          <div class="w-64 glass p-6 rounded-3xl glow-blue transform hover:-translate-y-2 transition">
            <h4 class="font-bold text-white">البطاقات الفضائية</h4>
            <p class="text-xs text-slate-400 mt-2">تصميم عائم مع ظلال نيون تفاعلية</p>
          </div>
          <div class="w-64 glass p-6 rounded-3xl glow-emerald transform hover:-translate-y-2 transition">
            <h4 class="font-bold text-white">إحصائيات الإتقان</h4>
            <div class="text-3xl font-black text-emerald-400 mt-3">${testData.skills.percentage}%</div>
          </div>
        </div>
      `;
    }

    function renderCommandHub() {
      return `
        <div class="max-w-xl mx-auto bg-slate-900/90 border border-blue-500/50 p-6 rounded-2xl shadow-2xl">
          <div class="flex items-center gap-3 bg-slate-800 px-4 py-3 rounded-xl border border-slate-700">
            <span class="text-blue-400 font-bold">🔍</span>
            <input type="text" placeholder="اكتب أمراً أو ابحث في المواد والملاحظات... (Ctrl + K)" class="bg-transparent text-sm text-white w-full outline-none" readonly />
          </div>
          <div class="mt-4 space-y-2">
            <div class="p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl flex justify-between items-center text-xs text-slate-300 cursor-pointer">
              <span>فتح لوحة التحكم المباشرة</span>
              <kbd class="px-2 py-1 bg-slate-700 text-slate-400 rounded">Enter</kbd>
            </div>
          </div>
        </div>
      `;
    }

    function renderGenericModel(id) {
      return `
        <div class="p-8 text-center bg-slate-900/50 rounded-2xl border border-slate-800 flex flex-col items-center justify-center min-h-[400px]">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center text-white text-2xl font-black shadow-lg mb-4">
            ${id}
          </div>
          <h3 class="text-2xl font-bold text-white">هيكل نموذج التصميم رقم ${id}</h3>
          <p class="text-sm text-slate-400 max-w-md mt-2">تصميم تفاعلي متجاوب يحتوي على كافة البيانات الافتراضية لاختبار شاشات الهاتف واللابتوب.</p>
          <button onclick="alert('تم تفعيل نموذج ${id}')" class="mt-6 px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl shadow-lg transition">تطبيق هذا الهيكل</button>
        </div>
      `;
    }

    window.onload = init;
  </script>
</body>
</html>
