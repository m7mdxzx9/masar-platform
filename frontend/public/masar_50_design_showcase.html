              تُعد الشبكات العصبية العملاقة حجر الزاوية في تطور أنظمة الذكاء الاصطناعي الحديثة، حيث تعتمد على ربط الملايين من المتغيرات وتحسين دالة الخطأ بدقة فائقة.
            </p>
          </div>
        `
      },

      // MODEL 8: Interactive Graph / Node Map
      {
        number: 8,
        title: "Interactive Graph / Node Map (خريطة المعرفة الشبكية)",
        paradigm: "Node Vector Canvas",
        desc: "شبكة مفاهيمية مع عقد ربط متصلة تفاعلية توضح روابط العلوم والمناهج",
        bg: "bg-[#020617]",
        font: "font-['Cairo']",
        render: () => `
          <div class="bg-slate-950 p-6 rounded-3xl border border-purple-500/40 min-h-[440px] flex flex-col justify-between font-['Cairo']">
            <div class="flex justify-between items-center border-b border-slate-900 pb-3">
              <h3 class="text-lg font-black text-white">🧠 شجرة المفاهيم والربط الشبكي</h3>
              <span class="text-xs bg-purple-500/20 text-purple-300 px-3 py-1 rounded-lg font-bold">12 عقدة متصلة</span>
            </div>
            <div class="flex justify-center items-center gap-6 my-8">
              <div onclick="selectNode('الذكاء الاصطناعي')" class="w-24 h-24 rounded-full bg-blue-600/30 border-2 border-blue-400 flex items-center justify-center text-center p-2 text-xs font-bold text-white shadow-lg cursor-pointer hover:scale-110 transition">الذكاء الاصطناعي</div>
              <div class="w-12 h-0.5 bg-purple-500"></div>
              <div onclick="selectNode('تعلم الآلة')" class="w-24 h-24 rounded-full bg-purple-600/30 border-2 border-purple-400 flex items-center justify-center text-center p-2 text-xs font-bold text-white shadow-lg cursor-pointer hover:scale-110 transition">تعلم الآلة</div>
            </div>
            <div id="nodeInfo" class="p-3 bg-slate-900 rounded-xl text-xs text-slate-300 text-center border border-slate-800">
              انقر على أي عقدة للاطلاع على تفاصيل المهارة المترابطة.
            </div>
          </div>
        `
      },

      // MODEL 9: Focus Mode / Ultra-Minimal
      {
        number: 9,
        title: "Focus Mode / Ultra-Minimal (استوديو التركيز الهادئ)",
        paradigm: "Distraction-Free Zen Workspace",
        desc: "بيئة قراءة وتفكير هادئة خالية من القوائم الجانبية والمشتتات مع تايمر البومودورو",
        bg: "bg-[#121214]",
        font: "font-['Readex_Pro']",
        render: () => `
          <div class="max-w-2xl mx-auto p-8 rounded-3xl bg-slate-900/90 text-center border border-slate-800 font-['Readex_Pro']">
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-bold rounded-full">جلسة تركيز Pomodoro • نشطة</span>
            <div id="zenTimer" class="text-6xl font-black text-white mt-6 tracking-widest font-mono">25:00</div>
            <div class="flex justify-center gap-4 mt-6">
              <button onclick="toggleZenTimer()" id="zenBtn" class="px-6 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-extrabold shadow">بدء المؤقت</button>
              <button onclick="resetZenTimer()" class="px-6 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold border border-slate-700">إعادة ضبط</button>
            </div>
          </div>
        `
      },

      // MODEL 10: Modular Masonry Wall
      {
        number: 10,
        title: "Modular Masonry Wall (جدار البطاقات التكيفي)",
        paradigm: "Dynamic Masonry Grid Tiles",
        desc: "عرض بطاقات تفاعلي متكيف الأطوال مع خيارات الفلترة المباشرة حسب الفئة",
        bg: "bg-[#1E293B]",
        font: "font-['Cairo']",
        render: () => `
          <div class="space-y-6 font-['Cairo']">
            <div class="flex gap-2 border-b border-slate-700 pb-3 overflow-x-auto">
              <button onclick="filterMasonry('all')" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-xl">الكل</button>
              <button onclick="filterMasonry('ai')" class="px-4 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl hover:bg-slate-700">الذكاء الاصطناعي</button>
              <button onclick="filterMasonry('web')" class="px-4 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl hover:bg-slate-700">تطوير الويب</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="mason-card ai p-5 bg-slate-900 rounded-2xl border border-slate-800">
                <span class="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded font-bold">ذكاء اصطناعي</span>
                <h4 class="font-black text-base text-white mt-2">خوارزميات التعلم العميق</h4>
                <p class="text-xs text-slate-400 mt-2">مادة متخصصة في شبكات الأعصاب وتحسين النماذج.</p>
              </div>
              <div class="mason-card web p-5 bg-slate-900 rounded-2xl border border-slate-800">
                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-bold">تطوير الويب</span>
                <h4 class="font-black text-base text-white mt-2">React & TypeScript</h4>
                <p class="text-xs text-slate-400 mt-2">بناء تطبيقات واجهة مستخدم فائقة السرعة والتجاوب.</p>
              </div>
            </div>
          </div>
        `
      }
    ];

    function switchModel(index) {
      currentModelIndex = parseInt(index);
      const m = modelsData[currentModelIndex];
      
      document.getElementById("modelNumberBadge").innerText = `نموذج ${m.number < 10 ? '0' + m.number : m.number} من 10`;
      document.getElementById("paradigmBadge").innerText = m.paradigm;
      document.getElementById("modelTitle").innerText = m.title;
      document.getElementById("modelDesc").innerText = m.desc;

      const canvas = document.getElementById("modelCanvas");
      canvas.className = `rounded-3xl p-6 min-h-[620px] shadow-2xl transition-all duration-300 relative border border-slate-800/80 ${m.bg} ${m.font}`;
      canvas.innerHTML = m.render();
    }

    function prevModel() {
      if (currentModelIndex > 0) {
        document.getElementById("modelSelect").value = currentModelIndex - 1;
        switchModel(currentModelIndex - 1);
      }
    }

    function nextModel() {
      if (currentModelIndex < modelsData.length - 1) {
        document.getElementById("modelSelect").value = currentModelIndex + 1;
        switchModel(currentModelIndex + 1);
      }
    }

    // MODEL-SPECIFIC INTERACTION HANDLERS (No global scope bleed)
    function bentoSelectSubject(name) {
      const el = document.getElementById("bentoSubjectDetail");
      if (el) el.innerHTML = `✅ تم اختيار مادة: <strong>${name}</strong> - حالة الاختبارات: مكتملة بنسبة 85%.`;
    }

    function splitSelectNote(id) {
      const title = document.getElementById("splitNoteTitle");
      const body = document.getElementById("splitNoteBody");
      if (id === 1) {
        title.innerText = "شبكات الأعصاب الاصطناعية (ANN)";
        body.innerText = "تتكون شبكة الأعصاب الاصطناعية من طبقة مدخلات (Input Layer)، وطبقات خفية (Hidden Layers)، وطبقة مخرجات (Output Layer).";
      } else {
        title.innerText = "مصطلحات المحادثة باللغة الإنجليزية التقنية";
        body.innerText = "أهم مصطلحات المحادثة والتقنية: Machine Learning, Deep Learning, Supervised Learning, Latency, Throughput.";
      }
    }

    function executeIdeCmd() {
      const input = document.getElementById("ideInput");
      const log = document.getElementById("ideLog");
      if (input && input.value) {
        log.innerHTML += `<div>&gt; Command executed: <span class="text-emerald-300">${input.value}</span> - OK</div>`;
        input.value = "";
      }
    }

    function filterCmdPalette(val) {
      const items = document.querySelectorAll(".cmd-item");
      items.forEach(item => {
        if (item.innerText.includes(val)) {
          item.style.display = "flex";
        } else {
          item.style.display = "none";
        }
      });
    }

    function stepSelect(num) {
      const el = document.getElementById("stepDetail");
      if (el) el.innerHTML = `📌 تم تحديد المحطة رقم ${num} • تفاصيل المحاضرات والمستندات جاهزة للاستعراض.`;
    }

    let fontSize = 20;
    function changeFontSize(delta) {
      fontSize += delta * 2;
      const el = document.getElementById("editorialText");
      if (el) el.style.fontSize = fontSize + "px";
    }

    function selectNode(name) {
      const el = document.getElementById("nodeInfo");
      if (el) el.innerHTML = `🧠 تم اختيار العقدة المفاهيمية: <strong>${name}</strong> - الروابط النشطة: 4 وحدات دراسية.`;
    }

    let zenInterval = null;
    let zenSeconds = 1500;
    function toggleZenTimer() {
      const btn = document.getElementById("zenBtn");
      const timer = document.getElementById("zenTimer");
      if (zenInterval) {
        clearInterval(zenInterval);
        zenInterval = null;
        if (btn) btn.innerText = "استئناف المؤقت";
      } else {
        if (btn) btn.innerText = "إيقاف مؤقت";
        zenInterval = setInterval(() => {
          if (zenSeconds > 0) {
            zenSeconds--;
            const m = Math.floor(zenSeconds / 60);
            const s = zenSeconds % 60;
            if (timer) timer.innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
          }
        }, 1000);
      }
    }

    function resetZenTimer() {
      if (zenInterval) clearInterval(zenInterval);
      zenInterval = null;
      zenSeconds = 1500;
      const timer = document.getElementById("zenTimer");
      const btn = document.getElementById("zenBtn");
      if (timer) timer.innerText = "25:00";
      if (btn) btn.innerText = "بدء المؤقت";
    }

    function filterMasonry(cat) {
      const cards = document.querySelectorAll(".mason-card");
      cards.forEach(card => {
        if (cat === 'all' || card.classList.contains(cat)) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      });
    }

    window.onload = () => switchModel(0);
  </script>
</body>
</html>
