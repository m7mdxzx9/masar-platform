appId: com.masar.platform
productName: مسار محمد دغريري
directories:
  buildResources: electron
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Masar-Mohammed-Dgriri-Setup-${version}.${ext}
  icon: public/icon.png
mac:
  target:
    - dmg
    - zip
  artifactName: Masar-Mohammed-Dgriri-${version}.${ext}
  category: public.app-category.education
  icon: public/icon.png
linux:
  target:
    - AppImage
    - deb
  artifactName: Masar-Mohammed-Dgriri-${version}.${ext}
  category: Education
  icon: public/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: مسار محمد دغريري
extraResources:
  - from: public
    to: public
    filter:
      - "**/*"
