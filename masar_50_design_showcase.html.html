<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masar Platform - 50 UI Design Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', 'Inter', sans-serif; }
    .category-tab.active { background-color: #3b82f6; color: white; }
    .model-card { transition: all 0.2s ease-in-out; }
    .model-card:hover { transform: translateY(-3px); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header Section -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 p-4">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-blue-400">معرض تصاميم منصة مسار (50 Niche Layouts)</h1>
        <p class="text-xs text-slate-400">منصة استعراض التصاميم الهيكلية والتفاعلية</p>
      </div>
      <div class="flex items-center gap-3">
        <input type="text" id="searchInput" placeholder="بحث في التصاميم..." class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:border-blue-500">
        <button onclick="toggleDirection()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs">LTR / RTL</button>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col md:flex-row gap-6 p-4">
    
    <!-- Sidebar: Category Navigation (الأقسام الـ 10) -->
    <aside class="w-full md:w-64 space-y-2 shrink-0">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">الأقسام الرئيسية</h2>
      <nav id="categoriesNav" class="space-y-1">
        <button onclick="filterCategory('all')" class="category-tab active w-full text-right px-3 py-2 rounded-lg text-sm font-medium">الكل (50)</button>
        <button onclick="filterCategory('bento')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">1. Bento & Grids (1-5)</button>
        <button onclick="filterCategory('navigation')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">2. Navigation & Flows (6-10)</button>
        <button onclick="filterCategory('gamified')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">3. Interactive Nodes (11-15)</button>
        <button onclick="filterCategory('workspace')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">4. Workspaces & IDEs (16-20)</button>
        <button onclick="filterCategory('aesthetics')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">5. Visual Aesthetics (21-25)</button>
        <button onclick="filterCategory('microapps')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">6. Micro-Apps & Cards (26-30)</button>
        <button onclick="filterCategory('spatial')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">7. Spatial & OS UI (31-35)</button>
        <button onclick="filterCategory('minimal')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">8. Focused Reading (36-40)</button>
        <button onclick="filterCategory('data')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">9. Data & Streak UI (41-45)</button>
        <button onclick="filterCategory('hybrids')" class="category-tab w-full text-right px-3 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-800">10. Hybrids & Responsive (46-50)</button>
      </nav>
    </aside>

    <!-- Main Grid Container -->
    <main class="flex-1">
      <div id="modelsGrid" class="grid grid-cols-1 gap-8">
        <!-- يتم إضافة النماذج هنا بشكل ديناميكي -->
      </div>
    </main>

  </div>

  <script>
    function filterCategory(cat) {
      document.querySelectorAll('.category-tab').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      const cards = document.querySelectorAll('.model-card');
      cards.forEach(card => {
        if (cat === 'all' || card.dataset.category === cat) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function toggleDirection() {
      const html = document.documentElement;
      html.dir = html.dir === 'rtl' ? 'ltr' : 'rtl';
      html.lang = html.dir === 'rtl' ? 'ar' : 'en';
    }
  </script>
</body>
</html>
