      color: #F1F5F9;
      min-height: 100vh;

      flex-direction: column;

    /* Master Top Switcher Header */
    .master-header {
      background: #0B0E14;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .master-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .master-title-bar h1 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #FFFFFF;
    }

    .master-title-bar p {
      font-size: 0.8rem;
      color: #94A3B8;
    }

    .model-selector-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .model-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: #94A3B8;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .model-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .model-btn.active {
      background: #2563EB;
      color: white;
      border-color: #60A5FA;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);

    /* Main Display Viewport */
    .viewport-frame {
      flex: 1;
      position: relative;
    }

    .m-instance {
      display: none;
      min-height: calc(100vh - 85px);
      width: 100%;
    }

    .m-instance.active {

    .code-editor-font { font-family: 'JetBrains Mono', monospace; direction: ltr; text-align: left; }

    ];

    // Render Viewports and Tabs
    const tabsContainer = document.getElementById('tabsScroll');
    const viewportArea = document.getElementById('viewportArea');

    modelsData.forEach((m, idx) => {
      // Create Tab Button
      const btn = document.createElement('button');
      btn.className = `model-btn ${m.id === 1 ? 'active' : ''}`;
      btn.innerText = `${m.id}. ${m.badge}`;
      btn.onclick = () => switchModel(m.id);
      tabsContainer.appendChild(btn);

      // Create Viewport Instance
      const p = stylePresets[idx];
      const inst = document.createElement('div');
      inst.className = `m-instance ${m.id === 1 ? 'active' : ''}`;
      inst.id = `model-view-${m.id}`;
      inst.style.cssText = p.bg;
      inst.innerHTML = generate11Sections(m.id, m.name, p.card, p.border, p.btn, p.code, p.accent, p.textMuted);
      viewportArea.appendChild(inst);
    });

    function switchModel(id) {
      // Update Active Tab
      const btns = document.querySelectorAll('.model-btn');
      btns.forEach((b, idx) => {
        if (idx === id - 1) b.classList.add('active');
        else b.classList.remove('active');
      });

      // Update Active Viewport
      const views = document.querySelectorAll('.m-instance');
      views.forEach((v, idx) => {
        if (idx === id - 1) v.classList.add('active');
        else v.classList.remove('active');
      });

      // Update Desc
      document.getElementById('activeModelDesc').innerText = modelsData[id - 1].desc;
    }
  </script>
