<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مسار - 500 مقترح تحسين تفاعلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090A0F;
            --surface: #12131A;
            --surfaceHover: #1A1C26;
            --border: #242736;
            --accent: #00FFCC;
            --accentGlow: rgba(0, 255, 204, 0.15);
            --text: #F3F4F6;
            --textMuted: #9CA3AF;
            --success: #00FF88;
            --purple: #9D4EDD;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Outfit', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 100px;
        }

        header {
            background: linear-gradient(135deg, var(--surface), var(--bg));
            border-bottom: 1.5px solid var(--border);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            box-shadow: 0 0 15px var(--accent);
        }

        .header-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--textMuted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
        }

        .sidebar {
            flex: 1;
            max-width: 300px;
            position: sticky;
            top: 20px;
            height: fit-content;
            background-color: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 20px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            color: var(--accent);
        }

        .cat-link {
            display: block;
            padding: 10px 12px;
            color: var(--textMuted);
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .cat-link:hover, .cat-link.active {
            background-color: var(--surfaceHover);
            color: var(--text);
            border-right: 3px solid var(--accent);
        }

        .main-content {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            height: 50px;
            background-color: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            padding: 0 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
            text-align: right;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accentGlow);
        }

        .category-section {
            background-color: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            scroll-margin-top: 20px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .category-name {
            font-size: 18px;
            font-weight: 800;
        }

        .action-links {
            display: flex;
            gap: 12px;
        }

        .action-link {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .suggestions-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .suggestion-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background-color: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-card:hover {
            border-color: var(--accent);
            background-color: var(--surfaceHover);
        }

        .suggestion-card.selected {
            border-color: var(--accent);
            background-color: var(--accentGlow);
        }

        .checkbox-container {
            margin-left: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background-color: var(--surface);
        }

        .suggestion-card.selected .checkbox-custom {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .checkbox-custom::after {
            content: '✓';
            color: var(--bg);
            font-size: 12px;
            font-weight: 800;
            display: none;
        }

        .suggestion-card.selected .checkbox-custom::after {
            display: block;
        }

        .suggestion-details {
            flex: 1;
            text-align: right;
        }

        .suggestion-id {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .suggestion-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
        }

        /* Floating footer for copy action */
        .floating-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background-color: rgba(18, 19, 26, 0.95);
            border-top: 1.5px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .counter-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-label {
            font-size: 14px;
            color: var(--textMuted);
        }

        .counter-number {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            background-color: var(--accentGlow);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid var(--accent);
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border: none;
            border-radius: 12px;
            color: var(--bg);
            font-size: 14px;
            font-weight: 800;
            padding: 12px 28px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background-color: var(--success);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                max-width: 100%;
                position: relative;
                top: 0;
            }
            .floating-footer {
                padding: 0 20px;
                flex-direction: column;
                height: 110px;
                justify-content: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">تم النسخ بنجاح! الصق المقترحات في الدردشة وأرسلها للوكيل.</div>

        const selectedIds = new Set();

        const sidebarContainer = document.getElementById('sidebar-links');
        const sectionsContainer = document.getElementById('sections-container');
        const selectedCountEl = document.getElementById('selected-count');
        const copyBtn = document.getElementById('copy-btn');
        const searchInput = document.getElementById('search');
        const toast = document.getElementById('toast');

        function init() {
            renderSidebar();
            renderSections();
            updateCount();
            
            searchInput.addEventListener('input', handleSearch);
            copyBtn.addEventListener('click', copySelected);
        }

        function renderSidebar() {
            sidebarContainer.innerHTML = '';
            database.forEach((cat, index) => {
                const link = document.createElement('a');
                link.href = "#sec-" + cat.code;
                link.className = 'cat-link' + (index === 0 ? ' active' : '');
                link.innerText = cat.title.split(' (')[0];
                link.addEventListener('click', (e) => {
                    document.querySelectorAll('.cat-link').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                });
                sidebarContainer.appendChild(link);
            });
        }

        function renderSections() {
            sectionsContainer.innerHTML = '';
            database.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = "sec-" + cat.code;

                const header = document.createElement('div');
                header.className = 'category-header';
                
                const title = document.createElement('h2');
                title.className = 'category-name';
                title.innerText = cat.title;

                const actions = document.createElement('div');
                actions.className = 'action-links';

                const selectAll = document.createElement('button');
                selectAll.className = 'action-link';
                selectAll.innerText = 'تحديد الكل';
                selectAll.addEventListener('click', () => toggleCategory(cat, true));

                const deselectAll = document.createElement('button');
                deselectAll.className = 'action-link';
                deselectAll.innerText = 'إلغاء الكل';
                deselectAll.addEventListener('click', () => toggleCategory(cat, false));

                actions.appendChild(selectAll);
                actions.appendChild(deselectAll);
                header.appendChild(title);
                header.appendChild(actions);
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'suggestions-grid';

                cat.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'suggestion-card';
                    card.id = "card-" + item.id;
                    if (selectedIds.has(item.id)) card.classList.add('selected');

                    card.addEventListener('click', () => toggleSelection(item.id));

                    const checkbox = document.createElement('div');
                    checkbox.className = 'checkbox-container';
                    const checkCustom = document.createElement('div');
                    checkCustom.className = 'checkbox-custom';
                    checkbox.appendChild(checkCustom);

                    const details = document.createElement('div');
                    details.className = 'suggestion-details';

                    const sugId = document.createElement('div');
                    sugId.className = 'suggestion-id';
                    sugId.innerText = item.id;

                    const sugText = document.createElement('div');
                    sugText.className = 'suggestion-text';
                    sugText.innerText = item.desc;

                    details.appendChild(sugId);
                    details.appendChild(sugText);

                    card.appendChild(checkbox);
                    card.appendChild(details);
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                sectionsContainer.appendChild(section);
            });
        }

        function toggleSelection(id) {
            const card = document.getElementById("card-" + id);
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
                if (card) card.classList.remove('selected');
            } else {
                selectedIds.add(id);
                if (card) card.classList.add('selected');
            }
            updateCount();
        }

        function toggleCategory(cat, isSelect) {
            cat.items.forEach(item => {
                const card = document.getElementById("card-" + item.id);
                if (isSelect) {
                    selectedIds.add(item.id);
                    if (card) card.classList.add('selected');
                } else {
                    selectedIds.delete(item.id);
                    if (card) card.classList.remove('selected');
                }
            });
            updateCount();
        }

        function updateCount() {
            selectedCountEl.innerText = selectedIds.size;
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            database.forEach(cat => {
                cat.items.forEach(item => {
                    const card = document.getElementById("card-" + item.id);
                    if (card) {
                        const matches = item.id.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
                        card.style.display = matches ? 'flex' : 'none';
                    }
                });
            });
        }

        function copySelected() {
            if (selectedIds.size === 0) {
                alert('يرجى تحديد مقترح واحد على الأقل أولاً!');
                return;
            }

            let markdown = "لقد قمت باختيار مقترحات التطوير التالية لمنصة مسار:\n\n";
            database.forEach(cat => {
                let catHeaderAdded = false;
                cat.items.forEach(item => {
                    if (selectedIds.has(item.id)) {
                        if (!catHeaderAdded) {
                            markdown += `### 📂 ${cat.title}\n`;
                            catHeaderAdded = true;
                        }
                        markdown += `- [x] **[${item.id}]**: ${item.desc}\n`;
                    }
                });
                if (catHeaderAdded) markdown += "\n";
            });

            navigator.clipboard.writeText(markdown).then(() => {
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }).catch(() => {
                alert('فشل نسخ المقترحات تلقائياً، يرجى المحاولة يدوياً.');
            });
        }

        window.onload = init;
    </script>
</body>
