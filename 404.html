<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مسار - جاري التوجيه...</title>
  <script>
    // GitHub Pages SPA Single Page App redirect fallback script
    (function() {
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    })();
  </script>
</head>
<body>
  <div style="font-family: system-ui, sans-serif; text-align: center; padding: 50px;">
    <h2>جاري التوجيه إلى منصة مسار...</h2>
    <p>يرجى الانتظار لحظة</p>
  </div>
</body>
</html>
