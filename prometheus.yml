global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'masar-backend'
    # FastAPI does not expose metrics by default unless we add prometheus_fastapi_instrumentator
    # We will assume it will be added on port 8000
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
